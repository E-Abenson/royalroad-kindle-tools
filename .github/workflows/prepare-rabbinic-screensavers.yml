name: Prepare Rabbi Kindle Screensavers

on:
  push:
    branches:
      - rabbinic-screensavers-run
    paths:
      - ".github/workflows/prepare-rabbinic-screensavers.yml"
      - "kindle-screensaver-generator/prepare_screensavers.py"
      - "kindle-screensaver-generator/requirements.txt"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out screensaver generator
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kindle-screensaver-generator/requirements.txt

      - name: Install image-processing dependency
        run: python -m pip install -r kindle-screensaver-generator/requirements.txt

      - name: Download and prepare the two photographs
        run: python kindle-screensaver-generator/prepare_screensavers.py dist

      - name: Package finished screensavers
        run: |
          cd dist
          zip -9 ../rabbinic-kindle-screensavers.zip \
            01_Rav_Zvi_Kushelevsky.png \
            02_Rav_Osher_Arieli.png \
            README.txt \
            SOURCE_AND_PROCESSING_NOTES.json

      - name: Save finished files on this branch
        run: |
          mkdir -p kindle-screensaver-generator/output
          cp dist/01_Rav_Zvi_Kushelevsky.png kindle-screensaver-generator/output/
          cp dist/02_Rav_Osher_Arieli.png kindle-screensaver-generator/output/
          cp dist/README.txt kindle-screensaver-generator/output/
          cp dist/SOURCE_AND_PROCESSING_NOTES.json kindle-screensaver-generator/output/
          cp rabbinic-kindle-screensavers.zip kindle-screensaver-generator/output/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kindle-screensaver-generator/output/
          if git diff --cached --quiet; then
            echo "No generated files changed."
          else
            git commit -m "Add generated rabbinic Kindle screensavers"
            git push origin HEAD:rabbinic-screensavers-run
          fi

      - name: Upload downloadable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: rabbinic-kindle-screensavers
          path: rabbinic-kindle-screensavers.zip
          if-no-files-found: error
          retention-days: 14
