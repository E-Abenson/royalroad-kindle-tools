name: Publish KPM package

on:
  push:
    branches: [main, kpp-js-bundle-export-and-cleanup]
    paths:
      - "kpm/package/**"
      - "scripts/**"
      - "README.md"
      - "docs/**"
      - "install/Install-RoyalRoadTools.sh"
      - ".github/workflows/publish-kpm.yml"
  pull_request:
    paths:
      - "kpm/package/**"
      - "scripts/**"
      - "README.md"
      - "docs/**"
      - "install/Install-RoyalRoadTools.sh"
      - ".github/workflows/publish-kpm.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-kpm
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate every shell script
        run: |
          set -eu
          find install kpm/package scripts/native -type f -name '*.sh' -print | while IFS= read -r file; do
            echo "Checking $file"
            sh -n "$file"
          done
      - name: Verify active launchers and retired components
        run: |
          set -eu
          test -s kpm/package/scriptlets/KPP-Native-Bridge-Export.sh
          test -s kpm/package/scriptlets/KPP-JavaScript-Bundle-Export.sh
          test -s kpm/package/scriptlets/KPP-Page-Text-Capture.sh
          test -s kpm/package/files/kpp-page-capture.gz
          test -s kpm/package/scriptlets/Inspect-USB-Screen.sh
          test -s scripts/native/kpp_page_capture.c
          test -s scripts/native/kpp_start.S
          test -s scripts/native/build_kpp_page_capture.sh
          grep -Fq "files/kpp-page-capture.gz" kpm/package/install.sh
          grep -Fq "webkit_web_view_execute_script_return_str" scripts/native/kpp_page_capture.c
          python - <<'PY'
          import gzip
          import struct
          from pathlib import Path
          blob = gzip.decompress(Path("kpm/package/files/kpp-page-capture.gz").read_bytes())
          assert blob[:4] == b"\x7fELF", "helper is not an ELF executable"
          assert blob[4] == 1 and blob[5] == 1, "helper must be ELF32 little-endian"
          assert struct.unpack_from("<H", blob, 18)[0] == 40, "helper must target ARM"
          flags = struct.unpack_from("<I", blob, 36)[0]
          assert flags & 0x400, "helper must use ARM hard-float ABI"
          for marker in (
              b"gtk_offscreen_window_new",
              b"webkit_web_view_load_uri",
              b"webkit_web_view_execute_script_return_str",
              b"/lib/ld-linux-armhf.so.3",
          ):
              assert marker in blob, "missing expected Kindle runtime linkage: " + marker.decode()
          PY
          test ! -e kpm/package/scriptlets/Install-Rabbinic-Screensavers.sh
          test ! -e kpm/package/scriptlets/KindleBatchPrepareFix.sh
          test ! -e kpm/package/scriptlets/RoyalRoadTools-Cleanup.sh
          test ! -e kpm/package/scriptlets/RoyalRoadTools-Cleanup-Queue.txt
          test ! -e kpm/package/files/kindle_batch_prepare_main.lua.gz
          test ! -d scripts/tests
          test -s optional/batch-prepare/KindleBatchPrepareFix.sh
          test -s optional/batch-prepare/kindle_batch_prepare_main.lua.gz
          ! grep -Fq "KindleBatchPrepareFix.sh" kpm/package/install.sh
          grep -Fq "cleanup_retired_files()" kpm/package/scriptlets/KPM-Update-All.sh
          test ! -e kpm/build_koreader_screensavers.py
          test ! -d kpm/assets
          test ! -d pc-tools
          ! grep -Fq "install_koreader_screensavers()" kpm/package/install.sh
          ! grep -Fq "SCREENSAVER_REPO" kpm/package/scriptlets/KPM-Update-All.sh

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate package inputs
        run: |
          set -eu
          test -s kpm/package/scriptlets/KPP-Native-Bridge-Export.sh
          test -s kpm/package/scriptlets/KPP-JavaScript-Bundle-Export.sh
          test ! -e kpm/package/scriptlets/Install-Rabbinic-Screensavers.sh
          test ! -d pc-tools
          test ! -d kpm/assets
      - name: Download official KPM packager
        run: curl -fsSL https://raw.githubusercontent.com/KindleModding/KPM/main/kpm-helper.py -o kpm-helper.py
      - name: Calculate next package version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Other project releases (for example, USB-screen-v1.0.0) are not
          # KPM package versions. Select the newest semantic-version tag only.
          LATEST_TAG="$(gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName | test("^v?[0-9]+\\.[0-9]+\\.[0-9]+$"))][0].tagName // ""' 2>/dev/null || true)"
          # Compatibility floor: existing Kindles have Royal Road Kindle Tools
          # installed as 1.1.125. KPM compares version tuples, so publishing 0.1.x
          # is treated as older and the package is silently left untouched.
          VERSION_FLOOR="1.1.125"
          VERSION="$(python - "$LATEST_TAG" "$VERSION_FLOOR" <<'PY'
          import re
          import sys
          tag, floor = (arg.strip() for arg in sys.argv[1:3])
          def parse(value):
              match = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", value)
              if not match:
                  raise SystemExit("Invalid semantic version: " + value)
              return tuple(map(int, match.groups()))
          candidates = [parse(floor)]
          if tag:
              candidates.append(parse(tag))
          major, minor, patch = max(candidates)
          print(f"{major}.{minor}.{patch + 1}")
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build KPM package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import json, os
          path = "kpm/package/manifest.json"
          with open(path, encoding="utf-8") as f:
              manifest = json.load(f)
          manifest["version"] = [int(x) for x in os.environ["VERSION"].split(".")]
          with open(path, "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          mkdir -p dist
          python kpm-helper.py package pack kpm/package dist/
          PACKAGE="$(find dist -maxdepth 1 -type f -name '*.kpkg' | head -n 1)"
          test -n "$PACKAGE"
          tar -tzf "$PACKAGE" > dist/PACKAGE-CONTENTS.txt
          grep -qx 'manifest.json' dist/PACKAGE-CONTENTS.txt
          grep -q 'KPP-Native-Bridge-Export.sh' dist/PACKAGE-CONTENTS.txt
          grep -q 'KPP-JavaScript-Bundle-Export.sh' dist/PACKAGE-CONTENTS.txt
          grep -q 'Inspect-USB-Screen.sh' dist/PACKAGE-CONTENTS.txt
          grep -q 'KPM-Update-All.sh' dist/PACKAGE-CONTENTS.txt
          grep -q 'KPP-Page-Text-Capture.sh' dist/PACKAGE-CONTENTS.txt
          grep -q 'kpp-page-capture.gz' dist/PACKAGE-CONTENTS.txt
          if grep -Eiq 'KindleBatchPrepareFix.sh|kindle_batch_prepare_main.lua.gz|RoyalRoadTools-Cleanup(-Queue|-Completed)?\.txt|RoyalRoadTools-Cleanup\.log|RoyalRoadTools-Cleanup\.sh' dist/PACKAGE-CONTENTS.txt; then
            echo "Optional Batch Preparation or separate cleanup-history files found in the KPM package."
            exit 1
          fi
          grep -q 'screenlockpin.koplugin/plugin/util/screensaverutil.lua' dist/PACKAGE-CONTENTS.txt
          if grep -Eiq '(^|/)(koreader-screensavers-inverted|Install-Rabbinic-Screensavers|RR-KPP-Bytecode-Export|native-bridge-inspector|kpp-disassembler)(/|$)|chofetz-inverted|pc-tools' dist/PACKAGE-CONTENTS.txt; then
            echo "A retired project screensaver asset or Windows-only helper was included in the KPM package."
            exit 1
          fi
          sha256sum "$PACKAGE" | tee dist/SHA256SUMS
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
      - name: Upload the KPM package candidate
        uses: actions/upload-artifact@v4
        with:
          name: Royal-Road-Kindle-Tools-KPM-Package
          path: |
            ${{ env.PACKAGE }}
            dist/SHA256SUMS
          retention-days: 7
      - name: Publish versioned KPM release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" "$PACKAGE" "dist/SHA256SUMS" \
            --title "Royal Road Kindle Tools $RELEASE_VERSION" \
            --notes "Manual KPP native-binary and Hermes JavaScript-bundle exports for offline analysis in ChatGPT; experimental separate offscreen WebKit capture of public Royal Road page text (without KPP cookies or modification of the running browser); retired-artifact cleanup built into KPM-Update-All without an on-device queue or cleanup history; software-version reporting; and USB display inspection. Batch Preparation is optional and is not included in the regular package."
      - name: Update KPM repository manifest
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PACKAGE: ${{ env.PACKAGE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import json, os
          repo = os.environ["GITHUB_REPOSITORY"]
          version = [int(x) for x in os.environ["VERSION"].split(".")]
          filename = os.path.basename(os.environ["PACKAGE"])
          tag = os.environ["TAG"]
          manifest = {
              "manifest_version": 2,
              "id": "e-abenson",
              "name": "E-Abenson Kindle Tools",
              "description": "KPM packages for KPP investigation exports, experimental offscreen Royal Road page-text capture, USB display inspection, automatic retired-artifact cleanup, version reporting, and ScreenLockPin KOReader maintenance.",
              "packages": {
                  "royalroad-kindle-tools": {
                      "name": "Royal Road Kindle Tools",
                      "author": "E-Abenson",
                      "description": "Manual KPP native and Hermes JavaScript exports, experimental offscreen Royal Road page-text capture, USB display inspection, automatic retired-artifact cleanup through KPM Update All, version reporting, and ScreenLockPin KOReader maintenance.",
                      "artifacts": [{
                          "url": f"https://github.com/{repo}/releases/download/{tag}/{filename}",
                          "version": version,
                          "dependencies": [{"id": "rav-zvi-usb-overlay-fix", "min": [1, 0, 0]}],
                          "supported_platforms": ["kindlehf"]
                      }]
                  }
              }
          }
          previous_index = json.load(open("kpm-repo/manifest.json", encoding="utf-8"))
          overlay_package = previous_index.get("packages", {}).get("rav-zvi-usb-overlay-fix")
          if overlay_package:
              manifest["packages"]["rav-zvi-usb-overlay-fix"] = overlay_package
          with open("kpm-repo/manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kpm-repo/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish KPM repository index for $TAG"
            git push origin HEAD:main
          fi
