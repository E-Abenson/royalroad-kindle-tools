name: Publish KPM package

on:
  push:
    branches: [main]
    paths:
      - "kpm/package/**"
      - "pc-tools/native-bridge-inspector/**"
      - "install/Install-RoyalRoadTools.sh"
      - ".github/workflows/publish-kpm.yml"
  pull_request:
    paths:
      - "kpm/package/**"
      - "pc-tools/kpp-disassembler/**"
      - "pc-tools/native-bridge-inspector/**"
      - "install/Install-RoyalRoadTools.sh"
      - ".github/workflows/publish-kpm.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-kpm
  cancel-in-progress: false

jobs:
  validate-native-inspector:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pinned Capstone for Linux-side validation
        run: python -m pip install --disable-pip-version-check capstone==5.0.9

      - name: Run comprehensive native export and inspector regression tests
        run: python -m unittest discover -s pc-tools/native-bridge-inspector/tests -v

      - name: Compile and exercise the ELF disassembly pipeline
        run: |
          set -eu
          python -m py_compile pc-tools/native-bridge-inspector/kpp_native_inspect.py
          python - <<'PY'
          import tarfile
          from pathlib import Path
          binary = Path("/usr/bin/ls").resolve()
          with tarfile.open("native-inspector-test.tar.gz", "w:gz") as archive:
              archive.add(str(binary), arcname="files/001_test.elf")
          PY
          python - <<'PY'
          import importlib.util, tarfile
          spec = importlib.util.spec_from_file_location("native_inspector", "pc-tools/native-bridge-inspector/kpp_native_inspect.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          with tarfile.open("native-inspector-test.tar.gz", "r:gz") as archive:
              for member in archive.getmembers():
                  print("Archive test member:", repr(member.name), "regular:", member.isfile())
                  if member.isfile():
                      data = archive.extractfile(member).read()
                      print("ELF header recognized:", module.elf_layout(data) is not None, "magic:", data[:4].hex())
          PY
          python pc-tools/native-bridge-inspector/kpp_native_inspect.py native-inspector-test.tar.gz
          python - <<'PY'
          from pathlib import Path
          report = Path("KPP-Native-Bridge-Findings.txt")
          if not report.is_file() or report.stat().st_size == 0:
              raise SystemExit("The inspector did not create a non-empty findings report.")
          text = report.read_text(encoding="utf-8")
          required = (
              "KPP NATIVE BRIDGE",
              "COVERAGE SUMMARY",
              "ELF files inspected: 1",
              "CROSS-LIBRARY BROWSER/BRIDGE IMPORT LINKS",
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit("Findings report is missing expected sections: " + repr(missing))
          print("Native ELF parsing and report-section validation passed.")
          PY

  validate-windows-wheel:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the bundled wheel and replace a stale extracted cache
        shell: pwsh
        run: |
          $helper = Join-Path $env:GITHUB_WORKSPACE "pc-tools/native-bridge-inspector"
          $wheel = Join-Path $helper "capstone-5.0.9-py3-none-win_amd64.whl"
          $env:KPP_CAPSTONE_WHEEL = $wheel
          python -c "import hashlib,json,os,urllib.request; e='732cedbbb56d42e723f14d7af6387f1454194a820b4b96b56d1e53f865ef85d0'; d=json.load(urllib.request.urlopen('https://pypi.org/pypi/capstone/5.0.9/json',timeout=30)); a=next(x for x in d['urls'] if x['filename']=='capstone-5.0.9-py3-none-win_amd64.whl'); assert a['digests']['sha256']==e,'PyPI wheel hash differs from pinned value'; r=urllib.request.urlopen(urllib.request.Request(a['url'],headers={'User-Agent':'KPP-Native-Inspector-CI/1.0'}),timeout=90); p=os.environ['KPP_CAPSTONE_WHEEL']; open(p,'wb').write(r.read()); h=hashlib.sha256(open(p,'rb').read()).hexdigest(); assert h==e,'wheel SHA256 mismatch: '+h; print('Downloaded the exact pinned Capstone wheel.')"
          $staleRuntime = Join-Path $helper ".capstone-runtime-5.0.9"
          New-Item -ItemType Directory -Force -Path (Join-Path $staleRuntime "capstone") | Out-Null
          Set-Content -Path (Join-Path $staleRuntime "capstone/__init__.py") -Value '__version__ = "5.0.7"' -NoNewline
          python -c "import importlib.util,pathlib,sys; root=pathlib.Path(sys.argv[1]); spec=importlib.util.spec_from_file_location('native_inspector',root/'kpp_native_inspect.py'); module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module); cap=module.load_capstone(root); assert cap.__version__=='5.0.9','loaded wrong Capstone version: '+cap.__version__; loaded=pathlib.Path(cap.__file__).resolve(); runtime=(root/'.capstone-runtime-5.0.9').resolve(); assert loaded.is_relative_to(runtime),'Capstone loaded outside the verified runtime: '+str(loaded); cs=cap.Cs(cap.CS_ARCH_ARM64,cap.CS_MODE_ARM); ins=list(cs.disasm(bytes.fromhex('1f2003d5'),0x1000)); assert ins and ins[0].mnemonic=='nop','AArch64 disassembly failed'; print('Stale 5.0.7 cache replaced; bundled 5.0.9 loaded and decoded ARM64 NOP.') " "$helper"
          python -m py_compile pc-tools/native-bridge-inspector/kpp_native_inspect.py

  publish:
    needs: [validate-native-inspector, validate-windows-wheel]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh checkout to latest main before packaging
        if: github.event_name != 'pull_request'
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Patch Kindle Batch Preparation controls (validated source)
        run: python scripts/patch_batch_controls.py

      - name: Validate shell and Windows helper scripts
        run: |
          set -eu
          echo "Checking POSIX shell scripts..."
          find install kpm/package -type f -name '*.sh' -print | while IFS= read -r file; do
            echo "Checking $file"
            sh -n "$file" || exit 1
          done
          echo "Checking native bridge Windows helper..."
          python -m py_compile pc-tools/native-bridge-inspector/kpp_native_inspect.py
          test -s pc-tools/native-bridge-inspector/Run-KPP-Native-Inspection.bat
          test -s pc-tools/native-bridge-inspector/README-FIRST.txt
          test -s kpm/package/scriptlets/KPP-Native-Bridge-Export.sh
          test -s kpm/package/scriptlets/Install-Rabbinic-Screensavers.sh
          test -s kpm/package/scriptlets/Inspect-USB-Screen.sh
          echo "All source checks passed."

      - name: Download official KPM packager
        run: |
          curl -fsSL https://raw.githubusercontent.com/KindleModding/KPM/main/kpm-helper.py -o kpm-helper.py

      - name: Calculate next package version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""' 2>/dev/null || true)"
          VERSION="$(python - "$LATEST_TAG" <<'PY'
          import re
          import sys
          tag = sys.argv[1].strip()
          if not tag:
              print("0.1.0")
          else:
              match = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", tag)
              if not match:
                  raise SystemExit("Latest release tag is not semantic versioning: " + tag)
              major, minor, patch = map(int, match.groups())
              print(f"{major}.{minor}.{patch + 1}")
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set package version and build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import json, os
          path = "kpm/package/manifest.json"
          with open(path, encoding="utf-8") as f:
              manifest = json.load(f)
          manifest["version"] = [int(x) for x in os.environ["VERSION"].split(".")]
          with open(path, "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          mkdir -p dist
          python kpm-helper.py package pack kpm/package dist/
          PACKAGE="$(find dist -maxdepth 1 -type f -name '*.kpkg' | head -n 1)"
          test -n "$PACKAGE"
          tar -tzf "$PACKAGE" | grep -qx 'manifest.json'
          tar -tzf "$PACKAGE" | grep -q 'kindle_batch_prepare_main.lua.gz' || { echo "KPM package is missing the bundled Kindle Batch Preparation source"; exit 1; }
          tar -tzf "$PACKAGE" | grep -q 'RoyalRoadTools-Cleanup-Queue.txt' || { echo "KPM package is missing the cleanup queue template"; exit 1; }
          tar -tzf "$PACKAGE" | grep -q 'KPP-Native-Bridge-Export.sh' || { echo "KPM package is missing the current native bridge export launcher"; exit 1; }
          tar -tzf "$PACKAGE" | grep -q 'Install-Rabbinic-Screensavers.sh' || { echo "KPM package is missing the manual rabbinic screensaver downloader"; exit 1; }
          tar -tzf "$PACKAGE" | grep -q 'Inspect-USB-Screen.sh' || { echo "KPM package is missing the read-only USB display inspector"; exit 1; }
          if tar -tzf "$PACKAGE" | grep -Eq 'scriptlets/(KPP-Comprehensive-Diagnostic|KPP-Last-Open-Page-Check|RR-KPP-Bytecode-Export)[.]sh'; then
            echo "A completed KPP diagnostic/bytecode launcher was reintroduced into the KPM package"
            exit 1
          fi
          if tar -tzf "$PACKAGE" | grep -Eq 'RR-KPP-Interface-Inspector(-Upload)?[.]sh'; then
            echo "Retired Kindle-side interface-inspector tools must not be included in the KPM package"
            exit 1
          fi
          if tar -tzf "$PACKAGE" | grep -Eq 'RR-LIPC-READONLY-(PROBE|UPLOAD)[.]sh'; then
            echo "Retired full LIPC probe/uploader must not be included in the package"
            exit 1
          fi
          if tar -tzf "$PACKAGE" | grep -Eq 'scriptlets/(RR-JS-Smoke-Test|RR-KPP-Bundle-Scan|RR-LIPC-Metadata-Check|RR-Upload-Diagnostic|RR-Upload-Bundle-Scan|KindleBatchPrepareDiagnostics|RoyalRoadTools|Kindle-Version-Report)[.]sh'; then
            echo "A retired launcher was reintroduced into the KPM package"
            exit 1
          fi
          mkdir -p dist/KPP-Native-Bridge-Inspector
          cp -R pc-tools/native-bridge-inspector/. dist/KPP-Native-Bridge-Inspector/
          WHEEL="dist/KPP-Native-Bridge-Inspector/capstone-5.0.9-py3-none-win_amd64.whl"
          python - "$WHEEL" <<'PY'
          import hashlib, json, sys, urllib.request
          destination = sys.argv[1]
          expected = "732cedbbb56d42e723f14d7af6387f1454194a820b4b96b56d1e53f865ef85d0"
          metadata = json.load(urllib.request.urlopen("https://pypi.org/pypi/capstone/5.0.9/json", timeout=30))
          artifact = next(item for item in metadata["urls"] if item["filename"] == "capstone-5.0.9-py3-none-win_amd64.whl")
          if artifact["digests"]["sha256"] != expected:
              raise SystemExit("PyPI Capstone wheel SHA256 differs from the pinned expected value.")
          request = urllib.request.Request(artifact["url"], headers={"User-Agent": "KPP-Native-Inspector-Build/1.0"})
          with urllib.request.urlopen(request, timeout=90) as response, open(destination, "wb") as output:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  output.write(chunk)
          actual = hashlib.sha256(open(destination, "rb").read()).hexdigest()
          if actual != expected:
              raise SystemExit("Downloaded Capstone wheel SHA256 mismatch: " + actual)
          print("Downloaded the exact pinned Capstone wheel.")
          PY
          python - "$WHEEL" "dist/KPP-Native-Bridge-Inspector/CAPSTONE-LICENSE.txt" <<'PY'
          import sys, zipfile
          wheel, destination = sys.argv[1:]
          with zipfile.ZipFile(wheel) as archive:
              candidates = [
                  name for name in archive.namelist()
                  if "license" in name.lower() and not name.endswith("/")
              ]
              if not candidates:
                  raise SystemExit("Capstone wheel did not contain its license file.")
              with open(destination, "wb") as output:
                  output.write(archive.read(candidates[0]))
          PY
          (cd dist && zip -qr KPP-Native-Bridge-Inspector-Windows.zip KPP-Native-Bridge-Inspector)
          sha256sum "$PACKAGE" dist/KPP-Native-Bridge-Inspector-Windows.zip | tee dist/SHA256SUMS
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      - name: Upload the complete Windows helper for direct retrieval
        uses: actions/upload-artifact@v4
        with:
          name: KPP-Native-Bridge-Inspector-Windows
          path: dist/KPP-Native-Bridge-Inspector-Windows.zip
          retention-days: 7

      - name: Publish immutable versioned release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" "$PACKAGE" \
            "dist/KPP-Native-Bridge-Inspector-Windows.zip" "dist/SHA256SUMS" \
            --title "Royal Road Kindle Tools ${{ steps.version.outputs.version }}" \
            --notes "KPM package with one manual read-only native KPP executable/shared-library export and a comprehensive offline Windows ELF inspector. The inspector uses bundled, SHA256-verified Capstone 5.0.9 to disassemble named browser/bridge functions and locate static references to relevant strings across every ELF in the supplied archive. It makes no network connections on the user's PC and saves one local findings report. Automatic cleanup/version reporting and KOReader maintenance tools are also included."

      - name: Update KPM repository manifest
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PACKAGE: ${{ env.PACKAGE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import json, os
          repo = os.environ["GITHUB_REPOSITORY"]
          version = [int(x) for x in os.environ["VERSION"].split(".")]
          filename = os.path.basename(os.environ["PACKAGE"])
          tag = os.environ["TAG"]
          manifest = {
              "manifest_version": 2,
              "id": "e-abenson",
              "name": "E-Abenson Kindle Tools",
              "description": "KPM packages maintained for the Royal Road Kindle Tools project.",
              "packages": {
                  "royalroad-kindle-tools": {
                      "name": "Royal Road Kindle Tools",
                      "author": "E-Abenson",
                      "description": "One-run read-only native KPP executable/shared-library export, comprehensive offline Windows ELF disassembly and cross-reference analysis with locally saved findings and no PC network upload, automatic cleanup/version reporting, plus KOReader maintenance tools.",
                      "artifacts": [{
                          "url": f"https://github.com/{repo}/releases/download/{tag}/{filename}",
                          "version": version,
                          "dependencies": [],
                          "supported_platforms": ["kindlehf"]
                      }]
                  }
              }
          }
          with open("kpm-repo/manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kpm-repo/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish KPM repository index for ${{ steps.version.outputs.tag }}"
            git push origin HEAD:main
          fi
