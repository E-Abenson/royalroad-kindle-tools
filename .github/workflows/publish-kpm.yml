name: Publish KPM package

on:
  push:
    branches: [main]
    paths:
      - "kpm/package/**"
      - "install/Install-RoyalRoadTools.sh"
      - ".github/workflows/publish-kpm.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-kpm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh checkout to latest main before packaging
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Patch Kindle Batch Preparation controls (validated source)
        run: python scripts/patch_batch_controls.py

      - name: Validate shell and Windows helper scripts
        run: |
          set -eu
          echo "Checking POSIX shell scripts..."
          find install kpm/package -type f -name '*.sh' -print | while IFS= read -r file; do
            echo "Checking $file"
            sh -n "$file" || exit 1
          done
          echo "Checking the one-time Windows Python disassembler..."
          python -m py_compile pc-tools/kpp-disassembler/kpp_disassemble.py
          test -s pc-tools/kpp-disassembler/Run-KPP-Disassembly.bat
          test -s pc-tools/kpp-disassembler/README-FIRST.txt
          echo "All source checks passed."

      - name: Download official KPM packager
        run: |
          curl -fsSL https://raw.githubusercontent.com/KindleModding/KPM/main/kpm-helper.py -o kpm-helper.py

      - name: Calculate next package version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""' 2>/dev/null || true)"
          VERSION="$(python - "$LATEST_TAG" <<'PY'
          import re
          import sys
          tag = sys.argv[1].strip()
          if not tag:
              print("0.1.0")
          else:
              match = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", tag)
              if not match:
                  raise SystemExit("Latest release tag is not semantic versioning: " + tag)
              major, minor, patch = map(int, match.groups())
              print(f"{major}.{minor}.{patch + 1}")
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set package version and build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import json, os
          path = "kpm/package/manifest.json"
          with open(path, encoding="utf-8") as f:
              manifest = json.load(f)
          manifest["version"] = [int(x) for x in os.environ["VERSION"].split(".")]
          with open(path, "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          mkdir -p dist
          python kpm-helper.py package pack kpm/package dist/
          PACKAGE="$(find dist -maxdepth 1 -type f -name '*.kpkg' | head -n 1)"
          test -n "$PACKAGE"
          tar -tzf "$PACKAGE" | grep -qx 'manifest.json'
          tar -tzf "$PACKAGE" | grep -q 'kindle_batch_prepare_main.lua.gz' || { echo "KPM package is missing the bundled Kindle Batch Preparation source"; exit 1; }
          tar -tzf "$PACKAGE" | grep -q 'RoyalRoadTools-Cleanup-Queue.txt' || { echo "KPM package is missing the cleanup queue template"; exit 1; }
          tar -tzf "$PACKAGE" | grep -q 'RR-KPP-Interface-Inspector.sh' || { echo "KPM package is missing the read-only KPP interface inspector"; exit 1; }
          tar -tzf "$PACKAGE" | grep -q 'RR-KPP-Interface-Inspector-Upload.sh' || { echo "KPM package is missing the manual Pasters.io report uploader"; exit 1; }
          tar -tzf "$PACKAGE" | grep -q 'RR-KPP-Bytecode-Export.sh' || { echo "KPM package is missing the USB-visible KPP bytecode exporter"; exit 1; }
          if tar -tzf "$PACKAGE" | grep -Eq 'RR-LIPC-READONLY-(PROBE|UPLOAD)[.]sh'; then
            echo "Retired full LIPC probe/uploader must not be included in the package"
            exit 1
          fi
          mkdir -p dist/KPP-One-Time-Disassembler
          cp -R pc-tools/kpp-disassembler/. dist/KPP-One-Time-Disassembler/
          (cd dist && zip -qr KPP-One-Time-Disassembler-Windows.zip KPP-One-Time-Disassembler)
          sha256sum "$PACKAGE" dist/KPP-One-Time-Disassembler-Windows.zip | tee dist/SHA256SUMS
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      - name: Publish immutable versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" "$PACKAGE" \
            "dist/KPP-One-Time-Disassembler-Windows.zip" "dist/SHA256SUMS" \
            --title "Royal Road Kindle Tools ${{ steps.version.outputs.version }}" \
            --notes "KPM package with manual read-only KPP inspection, one-time USB-visible Hermes bundle export, optional one-day Pasters.io text-report upload, automatic version reporting after Update All, verified cleanup, and KOReader plugin repair utility. Includes a Windows helper using Python already installed; no pip packages or compiler are required."

      - name: Update KPM repository manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PACKAGE: ${{ env.PACKAGE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import json, os
          repo = os.environ["GITHUB_REPOSITORY"]
          version = [int(x) for x in os.environ["VERSION"].split(".")]
          filename = os.path.basename(os.environ["PACKAGE"])
          tag = os.environ["TAG"]
          manifest = {
              "manifest_version": 2,
              "id": "e-abenson",
              "name": "E-Abenson Kindle Tools",
              "description": "KPM packages maintained for the Royal Road Kindle Tools project.",
              "packages": {
                  "royalroad-kindle-tools": {
                      "name": "Royal Road Kindle Tools",
                      "author": "E-Abenson",
                      "description": "Manual KPP inspection, one-time USB bytecode export and local Windows disassembly, optional report upload, automatic version reporting and cleanup, plus KOReader maintenance tools.",
                      "artifacts": [{
                          "url": f"https://github.com/{repo}/releases/download/{tag}/{filename}",
                          "version": version,
                          "dependencies": [],
                          "supported_platforms": ["kindlehf"]
                      }]
                  }
              }
          }
          with open("kpm-repo/manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kpm-repo/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish KPM repository index for ${{ steps.version.outputs.tag }}"
            git push origin HEAD:main
          fi
