name: Publish KPM package

on:
  push:
    branches: [main]
    paths:
      - "kpm/package/**"
      - "pc-tools/native-bridge-inspector/**"
      - "install/Install-RoyalRoadTools.sh"
      - ".github/workflows/publish-kpm.yml"
  pull_request:
    paths:
      - "kpm/package/**"
      - "pc-tools/kpp-disassembler/**"
      - "pc-tools/native-bridge-inspector/**"
      - "install/Install-RoyalRoadTools.sh"
      - ".github/workflows/publish-kpm.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-kpm
  cancel-in-progress: false

jobs:
  validate-native-inspector:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pinned Capstone for Linux-side validation
        run: python -m pip install --disable-pip-version-check capstone==5.0.9

      - name: Compile and exercise the ELF disassembly pipeline
        run: |
          set -eu
          python -m py_compile pc-tools/native-bridge-inspector/kpp_native_inspect.py
          python - <<'PY'
          import tarfile
          with tarfile.open("native-inspector-test.tar.gz", "w:gz") as archive:
              archive.add("/bin/ls", arcname="native-export/files/001_ls.elf")
          PY
          python pc-tools/native-bridge-inspector/kpp_native_inspect.py native-inspector-test.tar.gz
          grep -q "Disassembly backend: Capstone 5.0.9" KPP-Native-Bridge-Findings.txt
          grep -Eq "Instructions decoded during reference scan: [1-9][0-9]*" KPP-Native-Bridge-Findings.txt
          grep -q "ELF files fully inspected: 1" KPP-Native-Bridge-Findings.txt
          echo "Native ELF parsing and instruction disassembly passed."

  validate-windows-wheel:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify and test the bundled Windows Capstone wheel
        shell: pwsh
        run: |
          $wheel = Join-Path $env:RUNNER_TEMP "capstone-5.0.9-py3-none-win_amd64.whl"
          $url = "https://files.pythonhosted.org/packages/50/e6/6f06fdb6a9ed32b2f7cd9c036b92d5324112c3ef7080f2c71ecf367d40dd/capstone-5.0.9-py3-none-win_amd64.whl"
          Invoke-WebRequest -Uri $url -OutFile $wheel
          $actual = (Get-FileHash -Algorithm SHA256 $wheel).Hash.ToLowerInvariant()
          $expected = "732cedbbb56d42e723f14d7af6387f1454194a820b4b96b56d1e53f865ef85d0"
          if ($actual -ne $expected) { throw "Capstone wheel SHA256 mismatch: $actual" }
          $env:KPP_CAPSTONE_WHEEL = $wheel
          python -c "import os,sys,zipfile,tempfile,pathlib; p=pathlib.Path(os.environ['KPP_CAPSTONE_WHEEL']); d=pathlib.Path(tempfile.mkdtemp()); zipfile.ZipFile(p).extractall(d); sys.path.insert(0,str(d)); import capstone; assert capstone.__version__=='5.0.9'; cs=capstone.Cs(capstone.CS_ARCH_ARM64,capstone.CS_MODE_ARM); ins=list(cs.disasm(bytes.fromhex('1f2003d5'),0x1000)); assert ins and ins[0].mnemonic=='nop'; print('Windows Capstone wheel verified; AArch64 NOP decoded.')"
          python -m py_compile pc-tools/native-bridge-inspector/kpp_native_inspect.py

  publish:
    needs: [validate-native-inspector, validate-windows-wheel]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh checkout to latest main before packaging
        if: github.event_name != 'pull_request'
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Patch Kindle Batch Preparation controls (validated source)
        run: python scripts/patch_batch_controls.py

      - name: Validate shell and Windows helper scripts
        run: |
          set -eu
          echo "Checking POSIX shell scripts..."
          find install kpm/package -type f -name '*.sh' -print | while IFS= read -r file; do
            echo "Checking $file"
            sh -n "$file" || exit 1
          done
          echo "Checking native bridge Windows helper..."
          python -m py_compile pc-tools/native-bridge-inspector/kpp_native_inspect.py
          test -s pc-tools/native-bridge-inspector/Run-KPP-Native-Inspection.bat
          test -s pc-tools/native-bridge-inspector/README-FIRST.txt
          test -s kpm/package/scriptlets/KPP-Native-Bridge-Export.sh
          echo "All source checks passed."

      - name: Download official KPM packager
        run: |
          curl -fsSL https://raw.githubusercontent.com/KindleModding/KPM/main/kpm-helper.py -o kpm-helper.py

      - name: Calculate next package version
        id: version
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          LATEST_TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""' 2>/dev/null || true)"
          VERSION="$(python - "$LATEST_TAG" <<'PY'
          import re
          import sys
          tag = sys.argv[1].strip()
          if not tag:
              print("0.1.0")
          else:
              match = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", tag)
              if not match:
                  raise SystemExit("Latest release tag is not semantic versioning: " + tag)
              major, minor, patch = map(int, match.groups())
              print(f"{major}.{minor}.{patch + 1}")
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set package version and build
        env:
          VERSION: \${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import json, os
          path = "kpm/package/manifest.json"
          with open(path, encoding="utf-8") as f:
              manifest = json.load(f)
          manifest["version"] = [int(x) for x in os.environ["VERSION"].split(".")]
          with open(path, "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          mkdir -p dist
          python kpm-helper.py package pack kpm/package dist/
          PACKAGE="$(find dist -maxdepth 1 -type f -name '*.kpkg' | head -n 1)"
          test -n "$PACKAGE"
          tar -tzf "$PACKAGE" | grep -qx 'manifest.json'
          tar -tzf "$PACKAGE" | grep -q 'kindle_batch_prepare_main.lua.gz' || { echo "KPM package is missing the bundled Kindle Batch Preparation source"; exit 1; }
          tar -tzf "$PACKAGE" | grep -q 'RoyalRoadTools-Cleanup-Queue.txt' || { echo "KPM package is missing the cleanup queue template"; exit 1; }
          tar -tzf "$PACKAGE" | grep -q 'KPP-Native-Bridge-Export.sh' || { echo "KPM package is missing the current native bridge export launcher"; exit 1; }
          if tar -tzf "$PACKAGE" | grep -Eq 'scriptlets/(KPP-Comprehensive-Diagnostic|KPP-Last-Open-Page-Check|RR-KPP-Bytecode-Export)[.]sh'; then
            echo "A completed KPP diagnostic/bytecode launcher was reintroduced into the KPM package"
            exit 1
          fi
          if tar -tzf "$PACKAGE" | grep -Eq 'RR-KPP-Interface-Inspector(-Upload)?[.]sh'; then
            echo "Retired Kindle-side interface-inspector tools must not be included in the KPM package"
            exit 1
          fi
          if tar -tzf "$PACKAGE" | grep -Eq 'RR-LIPC-READONLY-(PROBE|UPLOAD)[.]sh'; then
            echo "Retired full LIPC probe/uploader must not be included in the package"
            exit 1
          fi
          if tar -tzf "$PACKAGE" | grep -Eq 'scriptlets/(RR-JS-Smoke-Test|RR-KPP-Bundle-Scan|RR-LIPC-Metadata-Check|RR-Upload-Diagnostic|RR-Upload-Bundle-Scan|KindleBatchPrepareDiagnostics|RoyalRoadTools|Kindle-Version-Report)[.]sh'; then
            echo "A retired launcher was reintroduced into the KPM package"
            exit 1
          fi
          mkdir -p dist/KPP-Native-Bridge-Inspector
          cp -R pc-tools/native-bridge-inspector/. dist/KPP-Native-Bridge-Inspector/
          WHEEL="dist/KPP-Native-Bridge-Inspector/capstone-5.0.9-py3-none-win_amd64.whl"
          curl -fsSL "https://files.pythonhosted.org/packages/50/e6/6f06fdb6a9ed32b2f7cd9c036b92d5324112c3ef7080f2c71ecf367d40dd/capstone-5.0.9-py3-none-win_amd64.whl" -o "$WHEEL"
          echo "732cedbbb56d42e723f14d7af6387f1454194a820b4b96b56d1e53f865ef85d0  $WHEEL" | sha256sum -c -
          python - "$WHEEL" "dist/KPP-Native-Bridge-Inspector/CAPSTONE-LICENSE.txt" <<'PY'
          import sys, zipfile
          wheel, destination = sys.argv[1:]
          with zipfile.ZipFile(wheel) as archive:
              candidates = [
                  name for name in archive.namelist()
                  if "license" in name.lower() and not name.endswith("/")
              ]
              if not candidates:
                  raise SystemExit("Capstone wheel did not contain its license file.")
              with open(destination, "wb") as output:
                  output.write(archive.read(candidates[0]))
          PY
          (cd dist && zip -qr KPP-Native-Bridge-Inspector-Windows.zip KPP-Native-Bridge-Inspector)
          sha256sum "$PACKAGE" dist/KPP-Native-Bridge-Inspector-Windows.zip | tee dist/SHA256SUMS
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      - name: Publish immutable versioned release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          gh release create "\${{ steps.version.outputs.tag }}" "$PACKAGE" \
            "dist/KPP-Native-Bridge-Inspector-Windows.zip" "dist/SHA256SUMS" \
            --title "Royal Road Kindle Tools \${{ steps.version.outputs.version }}" \
            --notes "KPM package with one manual read-only native KPP executable/shared-library export and a comprehensive offline Windows ELF inspector. The inspector uses bundled, SHA256-verified Capstone 5.0.9 to disassemble named browser/bridge functions and locate static references to relevant strings across every ELF in the supplied archive. It makes no network connections on the user's PC and saves one local findings report. Automatic cleanup/version reporting and KOReader maintenance tools are also included."

      - name: Update KPM repository manifest
        if: github.event_name != 'pull_request'
        env:
          VERSION: \${{ steps.version.outputs.version }}
          TAG: \${{ steps.version.outputs.tag }}
          PACKAGE: \${{ env.PACKAGE }}
          GH_TOKEN: \${{ github.token }}
        run: |
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import json, os
          repo = os.environ["GITHUB_REPOSITORY"]
          version = [int(x) for x in os.environ["VERSION"].split(".")]
          filename = os.path.basename(os.environ["PACKAGE"])
          tag = os.environ["TAG"]
          manifest = {
              "manifest_version": 2,
              "id": "e-abenson",
              "name": "E-Abenson Kindle Tools",
              "description": "KPM packages maintained for the Royal Road Kindle Tools project.",
              "packages": {
                  "royalroad-kindle-tools": {
                      "name": "Royal Road Kindle Tools",
                      "author": "E-Abenson",
                      "description": "One-run read-only native KPP executable/shared-library export, comprehensive offline Windows ELF disassembly and cross-reference analysis with locally saved findings and no PC network upload, automatic cleanup/version reporting, plus KOReader maintenance tools.",
                      "artifacts": [{
                          "url": f"https://github.com/{repo}/releases/download/{tag}/{filename}",
                          "version": version,
                          "dependencies": [],
                          "supported_platforms": ["kindlehf"]
                      }]
                  }
              }
          }
          with open("kpm-repo/manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kpm-repo/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish KPM repository index for \${{ steps.version.outputs.tag }}"
            git push origin HEAD:main
          fi
