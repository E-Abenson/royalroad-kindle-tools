name: Fix Kindle Batch Preparation Lua crash

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-kindle-plugin.yml"

permissions:
  contents: write

jobs:
  patch-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix translation-function shadowing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip
          from pathlib import Path

          path = Path("kpm/package/files/kindle_batch_prepare_main.lua.gz")
          with gzip.open(path, "rt", encoding="utf-8", newline="") as stream:
              source = stream.read()

          old = "    for _, mb in ipairs(choices) do"
          new = "    for choice_index, mb in ipairs(choices) do"
          count = source.count(old)

          if count == 0:
              if new in source:
                  print("The crash fix is already present; no source change needed.")
              else:
                  raise SystemExit("Expected loop not found; refusing to modify an unexpected source.")
          elif count != 1:
              raise SystemExit(f"Expected exactly one faulty loop; found {count}.")
          else:
              source = source.replace(old, new, 1)
              tmp = path.with_suffix(path.suffix + ".tmp")
              with tmp.open("wb") as raw:
                  with gzip.GzipFile(filename="", mode="wb", fileobj=raw, compresslevel=9, mtime=0) as zipped:
                      zipped.write(source.encode("utf-8"))
              tmp.replace(path)
              print("Patched createReserveMenuItem: loop index no longer shadows gettext's _().")

          with gzip.open(path, "rt", encoding="utf-8") as stream:
              checked = stream.read()
          if "for choice_index, mb in ipairs(choices) do" not in checked:
              raise SystemExit("Post-patch validation failed.")
          if "for _, mb in ipairs(choices) do" in checked:
              raise SystemExit("The faulty loop remains in the packaged source.")
          print("Compressed Lua source passes the patch validation.")
          PY

      - name: Commit corrected KPM payload
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- kpm/package/files/kindle_batch_prepare_main.lua.gz; then
            echo "No package change was necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kpm/package/files/kindle_batch_prepare_main.lua.gz
          git commit -m "Fix translation function shadowing in batch preparation menu"
          git push origin HEAD:main
